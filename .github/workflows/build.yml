name: Build (Windows, Linux & macOS)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxxf86vm-dev \
            libshaderc-dev \
            libspirv-cross-c-shared-dev \
            vulkan-tools \
            libvulkan-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja molten-vk shaderc spirv-cross vulkan-headers vulkan-loader

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build/bin" -Filter "QuarkEngine.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) {
            throw "QuarkEngine.exe was not found under build/bin"
          }
          $src = $exe.Directory.FullName

          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "$src/*" dist/ -Recurse -Force

          $compiler = Get-Command g++.exe -ErrorAction SilentlyContinue
          if ($null -ne $compiler) {
            $compilerDir = Split-Path $compiler.Source
            foreach ($runtime in @("libstdc++-6.dll", "libgcc_s_seh-1.dll", "libwinpthread-1.dll")) {
              Copy-Item (Join-Path $compilerDir $runtime) dist/ -Force -ErrorAction SilentlyContinue
            }
          }

          if (!(Test-Path "dist/QuarkEngine.exe")) {
            throw "QuarkEngine.exe was not staged"
          }
          if (!(Test-Path "dist/assets")) {
            throw "assets directory was not staged"
          }
          Write-Host "Staged files:"
          Get-ChildItem dist -Recurse | Select-Object -ExpandProperty FullName

      - name: Collect artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          src="build/bin/${{ matrix.build_type }}"
          if [ ! -f "$src/QuarkEngine" ]; then
            src="build/bin"
          fi
          mkdir -p dist
          cp "$src/QuarkEngine" dist/
          cp -P "$src"/*.so*     dist/ 2>/dev/null || true
          cp -P "$src"/*.dylib*  dist/ 2>/dev/null || true
          cp -r "$src/assets"    dist/assets 2>/dev/null || true

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: QuarkEngine-windows-${{ matrix.build_type }}
          path: dist/
          if-no-files-found: warn

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: QuarkEngine-linux-${{ matrix.build_type }}
          path: dist/
          if-no-files-found: warn

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: QuarkEngine-macos-${{ matrix.build_type }}
          path: dist/
          if-no-files-found: warn